configuration:
  mqtt_host:
    name: MQTT broker host
    description: Leave blank to use the Home Assistant Mosquitto broker (core-mosquitto).
  mqtt_port:
    name: MQTT broker port
  mqtt_username:
    name: MQTT username
    description: Optional broker username. Store the password in secrets.env and reference it with mqtt_password_env.
  mqtt_password_env:
    name: MQTT password environment variable
    description: Name of the variable in /config/secrets.env containing the broker password.
  secrets_file:
    name: Secrets file
    description: Fixed default is /config/secrets.env. Keep raw API keys and service-account JSON only in this file.
  poll_interval:
    name: Poll interval (seconds)
    description: How often providers are queried. Allowed range is 60 to 86400 seconds.
  discovery_prefix:
    name: MQTT discovery prefix
  data_dir:
    name: Runtime data directory
    description: Leave as /data.
  accounts:
    name: Provider accounts
    description: >-
      Add one account object per provider. Use the provider dropdown, account ID,
      and either a credential environment variable name or direct credential value.
      Provider-specific fields below are optional and only apply to the selected provider.

      OpenAI: use an API key with organization read access. Anthropic: use an API key.
      Grok: set team_id and use a management key. OpenRouter: use a management key.
      Gemini: set project_id and billing_export_table and use a service-account JSON key.
      CodeRabbit: set organization_id and use an API key. Alibaba Coding Plan: set
      opt_in, cli_path, and timeout and use the bl cookie. Kimi and DeepSeek use
      their normal API keys. OpenCode Go and Muse Code expose configuration-only data.
  accounts.provider:
    name: Provider
    description: "Select a supported provider: openai, anthropic, kimi, deepseek, opencode_go, muse_code, alibaba_coding_plan, grok, openrouter, gemini, or coderabbit."
  accounts.account_id:
    name: Account ID
    description: Stable unique ID such as primary or work.
  accounts.display_name:
    name: Display name
    description: Optional friendly name shown in Home Assistant sensors.
  accounts.credential_env:
    name: Credential environment variable
    description: Name only, for example OPENROUTER_API_KEY. Do not paste the secret here.
  accounts.credential_value:
    name: Direct credential value
    description: Optional direct credential for testing. Prefer credential_env with /config/secrets.env for production.
  accounts.team_id:
    name: Team ID
  accounts.organization_id:
    name: Organization ID
  accounts.days:
    name: Lookback days
  accounts.limit:
    name: Results per page
  accounts.start_date:
    name: Start date
  accounts.end_date:
    name: End date
  accounts.project_id:
    name: Billing project ID
  accounts.billing_export_table:
    name: Billing export table
  accounts.currency:
    name: Billing currency
  accounts.mode:
    name: Provider mode
  accounts.opt_in:
    name: Enable provider CLI
  accounts.cli_path:
    name: Provider CLI path
  accounts.timeout:
    name: Provider CLI timeout
