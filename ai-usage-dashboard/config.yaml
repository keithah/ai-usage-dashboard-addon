# Home Assistant add-on metadata for AI Usage Dashboard.
# Production collector deployment: local collector -> MQTT discovery
# -> Home Assistant dashboard. Configure via the add-on Configuration tab;
# credentials are *names* resolved from a secrets env file (see README.md).
name: AI Usage Dashboard
version: 0.2.0
slug: ai_usage_dashboard
description: Poll AI provider usage and quota and publish Home Assistant MQTT discovery sensors.
url: https://github.com/keithah/ai-usage-dashboard-addon
arch:
  - aarch64
  - amd64
init: false
image: ghcr.io/keithah/ai-usage-dashboard-addon
# Least-privilege mount for the user-editable secrets file. The per-add-on
# addon_config directory is mounted in the container at /config; nothing
# else from the Home Assistant configuration is mapped.
map:
  - type: addon_config
    read_only: false
    path: /config
options:
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password_env: MQTT_PASSWORD
  mqtt_password_value: ""
  secrets_file: /config/secrets.env
  poll_interval: 900
  discovery_prefix: homeassistant
  data_dir: /data
  accounts: []
schema:
  mqtt_host: str?
  mqtt_port: int(1,65535)?
  mqtt_username: str?
  mqtt_password_env: str?
  mqtt_password_value: password?
  secrets_file: str?
  poll_interval: int(60,86400)?
  discovery_prefix: str?
  data_dir: str?
  accounts:
    - provider: list(openai|anthropic|codex_oauth|claude_code_oauth|grok|openrouter|gemini|coderabbit|kimi|deepseek|opencode_go|muse_code|alibaba_coding_plan)
      account_id: str
      display_name: str?
      credential_env: str?
      credential_value: password?
      # Provider-specific options (fill in based on provider)
      team_id: str?
      organization_id: str?
      days: int?
      limit: int?
      start_date: str?
      end_date: str?
      project_id: str?
      billing_export_table: str?
      currency: str?
      mode: str?
      opt_in: bool?
      cli_path: str?
      timeout: int?
      oauth_bridge_url: url?
      oauth_bridge_ca_file: str?
      oauth_session: str?
